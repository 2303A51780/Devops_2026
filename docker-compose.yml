version: '3.8'

services:
  # Personal Finance Tracker Backend
  finance-backend:
    build:
      context: ./personal-finance-tracker09-02-2026/backend
      dockerfile: Dockerfile
    container_name: finance-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./personal-finance-tracker09-02-2026/backend/node_modules:/app/node_modules
    networks:
      - finance-network
    depends_on:
      - finance-frontend

  # Personal Finance Tracker Frontend
  finance-frontend:
    build:
      context: ./personal-finance-tracker09-02-2026/frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./personal-finance-tracker09-02-2026/frontend/node_modules:/app/node_modules
    networks:
      - finance-network

  # Training Platform Backend (2026_01_19)
  training-backend:
    build:
      context: ./2026_01_19
      dockerfile: Dockerfile
    container_name: training-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./2026_01_19/db:/app/db
      - ./2026_01_19/node_modules:/app/node_modules
    networks:
      - training-network

  # DevOps Frontend
  devops-frontend:
    build:
      context: ./devops28-01-2026/frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:5173
    volumes:
      - ./devops28-01-2026/frontend/node_modules:/app/node_modules
    networks:
      - devops-network

networks:
  finance-network:
    driver: bridge
  training-network:
    driver: bridge
  devops-network:
    driver: bridge
